{# ログイン後の共通ヘッダー。4つの主機能をタブで常設する。
   include 側から active に "inbox" / "forms" / "settings" / "account" を渡す。 #}
<header class="app-header">
  <div class="app-header-top">
    <div class="header-left">
      <img class="app-logo-img" src="{{ url_for('static', filename='img/app-icon-64.png') }}" alt="" aria-hidden="true">
      <span class="app-name">{{ APP_NAME }}</span>
    </div>
    <div class="header-right">
      {% if active == 'inbox' %}
      <span id="last-synced" class="last-synced"></span>
      <button id="sync-btn" class="btn btn-primary">
        <span class="sync-icon" aria-hidden="true">⟳</span>
        <span class="sync-label">回答を更新</span>
      </button>
      {% endif %}
      <span class="user-chip">{{ session.get('user_name') or 'ユーザー' }}</span>
    </div>
  </div>

  <nav class="app-tabs" aria-label="主な機能">
    <a href="{{ url_for('dashboard.index') }}"
       class="app-tab {% if active == 'inbox' %}is-active{% endif %}"
       {% if active == 'inbox' %}aria-current="page"{% endif %}>
      <span class="app-tab-icon" aria-hidden="true">✉</span>受信箱
    </a>
    <a href="{{ url_for('forms.forms_page') }}"
       class="app-tab {% if active == 'forms' %}is-active{% endif %}"
       {% if active == 'forms' %}aria-current="page"{% endif %}>
      <span class="app-tab-icon" aria-hidden="true">📄</span>フォーム
    </a>
    <a href="{{ url_for('dashboard.settings') }}"
       class="app-tab {% if active == 'settings' %}is-active{% endif %}"
       {% if active == 'settings' %}aria-current="page"{% endif %}>
      <span class="app-tab-icon" aria-hidden="true">⚙</span>設定
    </a>
    <a href="{{ url_for('dashboard.account') }}"
       class="app-tab {% if active == 'account' %}is-active{% endif %}"
       {% if active == 'account' %}aria-current="page"{% endif %}>
      <span class="app-tab-icon" aria-hidden="true">👤</span>アカウント
    </a>
  </nav>
</header>
